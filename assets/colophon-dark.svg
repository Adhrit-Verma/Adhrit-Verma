<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-labelledby="t">
<title id="t">Colophon: set in Hubot Sans, Mona Sans and Monaspace Neon; colours from Primer Primitives; icons from Octicons and Simple Icons; generated by scripts/generate.mjs.</title>
<style>@font-face{font-family:'HubotSans-600';src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
.d6{font-family:'HubotSans-600','Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;word-spacing:.14em}
@font-face{font-family:'MonaspaceNeon-400';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.m4{font-family:'MonaspaceNeon-400',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:400}
@font-face{font-family:'MonaSans-400';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.b4{font-family:'MonaSans-400','Segoe UI',Helvetica,Arial,sans-serif;font-weight:400;word-spacing:.05em}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.65,0,.35,1) forwards}
.rise{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.growX{transform-box:fill-box;transform-origin:left center;animation:growX 1.4s cubic-bezier(.65,0,.35,1) both}
.fx{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style>
<rect width="1000" height="130" fill="#0d1117"/>
<rect x="0" y="0" width="1000" height="1" fill="#3d444d"/>
<text x="0" y="62" class="d6 rise" font-size="24" fill="#f0f6fc">“I don’t just collect tech stacks —</text>
<text x="0" y="94" class="d6 rise" font-size="24" fill="#f0f6fc" style="animation-delay:.08s">I build things until they work.”</text>
<text x="1000" y="44" class="m4" font-size="10" fill="#9198a1" text-anchor="end" letter-spacing="1.6">COLOPHON</text>
<text x="1000" y="64" class="b4" font-size="12.5" fill="#9198a1" text-anchor="end">Hubot Sans, Mona Sans &amp; Monaspace Neon</text>
<text x="1000" y="84" class="b4" font-size="12.5" fill="#9198a1" text-anchor="end">Colour tokens: Primer Primitives</text>
<text x="1000" y="104" class="b4" font-size="12.5" fill="#9198a1" text-anchor="end">Icons: Octicons &amp; Simple Icons</text>
<text x="1000" y="124" class="b4" font-size="12.5" fill="#9198a1" text-anchor="end">Rendered by scripts/generate.mjs</text>
</svg>