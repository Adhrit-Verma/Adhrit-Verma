<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title">
<title id="title">How I build: real workflow to API layer to data to AI layer to shipped product, with a feedback loop</title>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes orbit{to{stroke-dashoffset:-100}}
.fx{transform-box:fill-box;transform-origin:center}
.gx{transform-box:fill-box;transform-origin:left center}
.bx{animation:glow 4.5s ease-in-out infinite}@keyframes glow{0%,100%{stroke-opacity:.35}12%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E7FF"/><stop offset=".5" stop-color="#A371F7"/><stop offset="1" stop-color="#00E7FF"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="248" rx="16" fill="#0D1117" stroke="#30363D"/>
<rect x="1" y="1" width="998" height="248" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="100" stroke-dasharray="14 86" style="animation:orbit 8s linear infinite"/>
<text class="m" x="30" y="38" font-size="12" letter-spacing="3" fill="#00E7FF">HOW I BUILD</text>
<text class="m" x="970" y="38" font-size="12" fill="#8B949E" text-anchor="end">workflow → api → data → ai → shipped</text>
<path id="main" d="M18,118 H982" stroke="#30363D" stroke-width="2" fill="none"/>
<path d="M18,118 H982" stroke="#00E7FF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8" fill="none" style="animation:flow 1s linear infinite"/>
<path id="back" d="M900,156 C900,236 100,236 100,156" stroke="#8B949E" stroke-opacity=".6" stroke-dasharray="3 7" fill="none" style="animation:flow 1.6s linear infinite reverse"/>
<circle r="3.5" fill="#F0B72F"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#back"/></animateMotion></circle>
<circle r="4" fill="#00E7FF"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><circle r="4" fill="#A371F7"><animateMotion dur="4.5s" begin="1.125s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><circle r="4" fill="#3FB950"><animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><circle r="4" fill="#F0B72F"><animateMotion dur="4.5s" begin="3.375s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><rect class="bx" x="18" y="80" width="164" height="76" rx="12" fill="#161B22" stroke="#F0B72F" stroke-width="1.6" style="animation-delay:0s"/>
<text x="100" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">Real workflow</text>
<text class="m" x="100" y="136" text-anchor="middle" font-size="10.5" fill="#8B949E">a messy manual process</text><rect class="bx" x="218" y="80" width="164" height="76" rx="12" fill="#161B22" stroke="#00E7FF" stroke-width="1.6" style="animation-delay:0.9s"/>
<text x="300" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">API layer</text>
<text class="m" x="300" y="136" text-anchor="middle" font-size="10.5" fill="#8B949E">Express · FastAPI · auth</text><rect class="bx" x="418" y="80" width="164" height="76" rx="12" fill="#161B22" stroke="#4F8EDB" stroke-width="1.6" style="animation-delay:1.8s"/>
<text x="500" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">Data</text>
<text class="m" x="500" y="136" text-anchor="middle" font-size="10.5" fill="#8B949E">PostgreSQL · Redis · SQL</text><rect class="bx" x="618" y="80" width="164" height="76" rx="12" fill="#161B22" stroke="#A371F7" stroke-width="1.6" style="animation-delay:2.7s"/>
<text x="700" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">AI layer</text>
<text class="m" x="700" y="136" text-anchor="middle" font-size="10.5" fill="#8B949E">RAG · LangGraph · agents</text><rect class="bx" x="818" y="80" width="164" height="76" rx="12" fill="#161B22" stroke="#3FB950" stroke-width="1.6" style="animation-delay:3.6s"/>
<text x="900" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">Shipped</text>
<text class="m" x="900" y="136" text-anchor="middle" font-size="10.5" fill="#8B949E">dashboards · CI/CD</text>
<text class="m" x="500" y="230" text-anchor="middle" font-size="11" fill="#8B949E">↺ measure, get feedback, iterate</text>
</svg>