<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172" role="img" aria-labelledby="t">
<title id="t">How I work: observe, model, build, augment, ship.</title>
<style>@font-face{font-family:'MonaspaceNeon-400';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.m4{font-family:'MonaspaceNeon-400',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:400}
@font-face{font-family:'HubotSans-600';src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
.d6{font-family:'HubotSans-600','Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;word-spacing:.14em}
@font-face{font-family:'MonaSans-400';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.b4{font-family:'MonaSans-400','Segoe UI',Helvetica,Arial,sans-serif;font-weight:400;word-spacing:.05em}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.65,0,.35,1) forwards}
.rise{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.growX{transform-box:fill-box;transform-origin:left center;animation:growX 1.4s cubic-bezier(.65,0,.35,1) both}
.fx{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style>
<rect width="1000" height="172" fill="#0d1117"/>
<path d="M100 58H900" stroke="#3d444d"/><rect class="growX" x="100" y="57.25" width="800" height="1.5" fill="#db6d28" style="animation-duration:4s;animation-delay:.2s"/>
<path id="mline" d="M100 58H900"/><circle r="3" fill="#db6d28" class="fade" style="animation-delay:4.2s"><animateMotion dur="7s" begin="4.2s" repeatCount="indefinite"><mpath href="#mline"/></animateMotion></circle>
<circle cx="100" cy="58" r="8" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.4"/><circle class="fade" cx="100" cy="58" r="3.5" fill="#db6d28" style="animation-delay:0.20s"/>
<text x="100" y="36" class="m4" font-size="10.5" fill="#9198a1" text-anchor="middle">01</text>
<text x="100" y="104" class="d6 rise" font-size="19" fill="#f0f6fc" text-anchor="middle" style="animation-delay:0.20s">Observe</text>
<text x="100" y="130" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:0.20s">sit with the manual</text>
<text x="100" y="148" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:0.20s">workflow first</text>
<circle cx="300" cy="58" r="8" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.4"/><circle class="fade" cx="300" cy="58" r="3.5" fill="#db6d28" style="animation-delay:1.15s"/>
<text x="300" y="36" class="m4" font-size="10.5" fill="#9198a1" text-anchor="middle">02</text>
<text x="300" y="104" class="d6 rise" font-size="19" fill="#f0f6fc" text-anchor="middle" style="animation-delay:1.15s">Model</text>
<text x="300" y="130" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:1.15s">schema, roles,</text>
<text x="300" y="148" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:1.15s">permissions, audit</text>
<circle cx="500" cy="58" r="8" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.4"/><circle class="fade" cx="500" cy="58" r="3.5" fill="#db6d28" style="animation-delay:2.10s"/>
<text x="500" y="36" class="m4" font-size="10.5" fill="#9198a1" text-anchor="middle">03</text>
<text x="500" y="104" class="d6 rise" font-size="19" fill="#f0f6fc" text-anchor="middle" style="animation-delay:2.10s">Build</text>
<text x="500" y="130" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:2.10s">APIs in Node.js</text>
<text x="500" y="148" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:2.10s">or Python</text>
<circle cx="700" cy="58" r="8" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.4"/><circle class="fade" cx="700" cy="58" r="3.5" fill="#db6d28" style="animation-delay:3.05s"/>
<text x="700" y="36" class="m4" font-size="10.5" fill="#9198a1" text-anchor="middle">04</text>
<text x="700" y="104" class="d6 rise" font-size="19" fill="#f0f6fc" text-anchor="middle" style="animation-delay:3.05s">Augment</text>
<text x="700" y="130" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:3.05s">RAG and agents, only</text>
<text x="700" y="148" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:3.05s">where they earn it</text>
<circle cx="900" cy="58" r="8" fill="#0d1117" stroke="#f0f6fc" stroke-width="1.4"/><circle class="fade" cx="900" cy="58" r="3.5" fill="#db6d28" style="animation-delay:4.00s"/>
<text x="900" y="36" class="m4" font-size="10.5" fill="#9198a1" text-anchor="middle">05</text>
<text x="900" y="104" class="d6 rise" font-size="19" fill="#f0f6fc" text-anchor="middle" style="animation-delay:4.00s">Ship</text>
<text x="900" y="130" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:4.00s">CI/CD, VPS, logs,</text>
<text x="900" y="148" class="b4 rise" font-size="13.5" fill="#9198a1" text-anchor="middle" style="animation-delay:4.00s">then iterate</text>
</svg>