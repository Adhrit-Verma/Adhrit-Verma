<text class="m" x="128.5" y="200" font-size="11" text-anchor="middle" fill="#C9D1D9">FastAPI</text><rect x="171" y="184" width="90" height="24" rx="12" fill="#1C2330" stroke="#30363D"/>
<text class="m" x="216" y="200" font-size="11" text-anchor="middle" fill="#C9D1D9">Sandboxing</text><rect x="269" y="184" width="62" height="24" rx="12" fill="#1C2330" stroke="#30363D"/>
<text class="m" x="300" y="200" font-size="11" text-anchor="middle" fill="#C9D1D9">Agents</text>
