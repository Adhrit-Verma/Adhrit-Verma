<svg xmlns="http://www.w3.org/2000/svg" width="480" height="228" viewBox="0 0 480 228" role="img" aria-labelledby="title">
<title id="title">Self-Extending AI: A UserAgent serves requests from an approved skill registry; when it hits a gap, a BuilderAgent writes a new skill package that is sandbox-validated and approved before it can ever run.</title>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes orbit{to{stroke-dashoffset:-100}}
.fx{transform-box:fill-box;transform-origin:center}
.gx{transform-box:fill-box;transform-origin:left center}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E7FF"/><stop offset=".5" stop-color="#A371F7"/><stop offset="1" stop-color="#00E7FF"/></linearGradient></defs>
<rect x="1" y="1" width="478" height="226" rx="14" fill="#161B22" stroke="#30363D"/>
<rect x="1" y="1" width="478" height="226" rx="14" fill="none" stroke="#3FB950" stroke-width="2" pathLength="100" stroke-dasharray="14 86" style="animation:orbit 8s linear infinite"/>
<circle class="fx" cx="32" cy="40" r="6" fill="none" stroke="#3FB950" style="animation:pulse 2s ease-out infinite"/>
<circle cx="32" cy="40" r="6" fill="#3FB950"/>
<text x="48" y="47" font-size="22" font-weight="700" fill="#E6EDF3">Self-Extending AI</text>
<rect x="389.6" y="26" width="66.4" height="24" rx="6" fill="none" stroke="#3FB950"/>
<text class="m" x="422.8" y="42" font-size="11" letter-spacing="1" text-anchor="middle" fill="#3FB950">AGENTS</text>
<text class="m" x="24" y="74" font-size="11" fill="#8B949E"><tspan fill="#3572A5">●</tspan> Python · Adhrit-Verma/two-agent-self-extending-ai-system</text>
<text x="24" y="104" font-size="13.5" fill="#C9D1D9">A UserAgent serves requests from an approved skill registry; when</text><text x="24" y="125" font-size="13.5" fill="#C9D1D9">it hits a gap, a BuilderAgent writes a new skill package that is</text><text x="24" y="146" font-size="13.5" fill="#C9D1D9">sandbox-validated and approved before it can ever run.</text>
