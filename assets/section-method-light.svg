<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="t">
<title id="t">03 — How I work</title>
<style>@font-face{font-family:'MonaspaceNeon-400';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.m4{font-family:'MonaspaceNeon-400',ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:400}
@font-face{font-family:'HubotSans-600';src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
.d6{font-family:'HubotSans-600','Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;word-spacing:.14em}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.65,0,.35,1) forwards}
.rise{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.growX{transform-box:fill-box;transform-origin:left center;animation:growX 1.4s cubic-bezier(.65,0,.35,1) both}
.fx{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style>
<rect width="1000" height="96" fill="#ffffff"/>
<text x="0" y="58" class="m4 rise" font-size="13" fill="#bc4c00">03</text>
<text x="40" y="62" class="d6 rise" font-size="34" fill="#1f2328" style="animation-delay:.08s">How I work</text>
<rect class="growX" x="0" y="84" width="1000" height="1" fill="#d1d9e0"/>
</svg>