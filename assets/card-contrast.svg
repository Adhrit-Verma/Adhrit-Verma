<svg xmlns="http://www.w3.org/2000/svg" width="480" height="228" viewBox="0 0 480 228" role="img" aria-labelledby="title">
<title id="title">Contrast: AI-assisted accessibility auditor. A 7-phase LangGraph pipeline crawls, scans (axe-core, Lighthouse, a11y tree), AI-assesses, generates fixes and re-verifies them in a fresh browser. 72 tests + W3C ACT accuracy scoring.</title>
<style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes orbit{to{stroke-dashoffset:-100}}
.fx{transform-box:fill-box;transform-origin:center}
.gx{transform-box:fill-box;transform-origin:left center}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

