<text class="m" x="411.7" y="42" font-size="11" letter-spacing="1" text-anchor="middle" fill="#00E7FF">AI · A11Y</text>
<text class="m" x="24" y="74" font-size="11" fill="#8B949E"><tspan fill="#F1E05A">●</tspan> JavaScript · Adhrit-Verma/Contrast</text>
<text x="24" y="104" font-size="13.5" fill="#C9D1D9">AI-assisted accessibility auditor. A 7-phase LangGraph pipeline</text><text x="24" y="125" font-size="13.5" fill="#C9D1D9">crawls, scans (axe-core, Lighthouse, a11y tree), AI-assesses,</text><text x="24" y="146" font-size="13.5" fill="#C9D1D9">generates fixes and re-verifies them in a fresh browser. 72 tests</text><text x="24" y="167" font-size="13.5" fill="#C9D1D9">+ W3C ACT accuracy scoring.</text>
