<svg xmlns="http://www.w3.org/2000/svg" width="480" height="228" viewBox="0 0 480 228" role="img" aria-labelledby="title">
<title id="title">GDC: Gradient Dense Code: keeps a scannable QR carrier but hides an extra payload in calibrated RGB gradients. Reed–Solomon, CRC32, interleaving, compression and camera decoding.</title>
<style>
